name: 'Automatically change the year and availability each month'

on:
  schedule:
    - cron: '0 0 1 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-availability:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Check
        uses: actions/checkout@v4

      - name: Update availability
        run: |
          node <<'EOF'
          const fs = require('fs');

          const filePath = './apiData.blockdev';
          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));

          const availability = data.response.availability;
          
          const months = [
            'January',
            'February',
            'March',
            'April',
            'May',
            'June',
            'July',
            'August',
            'September',
            'October',
            'November',
            'December'
          ];

          const now = new Date();
          
          const currentMonthIndex = now.getUTCMonth();
          const currentYear = now.getUTCFullYear();

          const updatedAvailability = {};

          for (const [key, value] of Object.entries(availability)) {
            const [month, yearStr] = key.split(' ');
            const year = parseInt(yearStr);

            const monthIndex = months.indexOf(month);

            let newMonth = month;
            let newYear = year;
            let newValue = value;

            const isPast = year < currentYear || (year === currentYear && monthIndex < currentMonthIndex);

            if (isPast) {
              newYear = year + 1;

              const maxAmount = value.amount.split('/')[1];

              newValue = {
                available: 'Available for invites',
                hexcode: '#1ac31f',
                amount: `0/${maxAmount}`
              };

              console.log(`[UPDATE] ${key} -> ${newMonth} ${newYear}`);
            }

            updatedAvailability[`${newMonth} ${newYear}`] = newValue;
          }

          fs.writeFileSync(
            filePath,
            JSON.stringify(data, null, 4)
          );

          console.log('[LOG] Finished updating availability');
          EOF

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add .
          git commit -m 'Reset monthly availability' || echo 'No changes to commit!'

      - name: Push changes
        run: |
          git push
